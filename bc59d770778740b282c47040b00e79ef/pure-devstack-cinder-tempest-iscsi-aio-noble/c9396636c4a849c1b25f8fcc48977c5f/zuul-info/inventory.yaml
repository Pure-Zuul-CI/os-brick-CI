      buildset: bc59d770778740b282c47040b00e79ef
      change: '997876'
      change_message: 'NVMe-oF: pin the host source interface on connect


        On a host with more than one interface (or HBA) able to reach an

        NVMe-oF target, an IP connect can egress an interface other than the

        one intended for that transport. Pin the host source so each connection

        leaves the interface the connector selected:


        - tcp:  --host-iface <egress interface>

        - rdma: --host-traddr <egress source address>


        The source is derived from the host routing table; the connector, not

        the driver, owns interface selection, because only the connector knows

        the compute host''s NICs. FC pins its host WWPN separately (in the

        NVMe/FC transport change). When the source cannot be determined the

        connection is made unpinned, as before, so this is backwards

        compatible.


        This is a source-interface (NIC/HBA) fix only; it does not change which

        transport a connection uses. In particular it does not stop host-side

        auto-connect daemons (nvme-stas / nvmf-autoconnect) from establishing

        controllers on other reachable fabrics for an array that exposes a

        single subsystem NQN across transports; that is an environmental

        concern (disable host auto-connect) and is noted in the release note.

        Per-host "nvme list-subsys" confirms the connector itself establishes

        controllers only on the requested transport.


        Closes-Bug: #2161246

        Change-Id: I9e5cb4a9559d39e8a2162e4f507a672acd9b03e0

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>

        '
